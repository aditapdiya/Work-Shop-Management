<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Workshop Management System{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      padding-top: 70px;
      padding-bottom: 70px;
      background-color: #f8f9fa;
    }

    .navbar-custom {
      background: linear-gradient(90deg, #030f27, #005f99);
    }

    .navbar-brand img {
      height: 40px;
      margin-right: 10px;
    }

    .navbar-custom .nav-link {
      color: white !important;
      font-weight: 500;
    }

    .navbar-custom .nav-link:hover {
      color: #00aaff !important;
    }

    footer {
      background: linear-gradient(90deg, #030f27, #005f99);
      color: white;
      text-align: center;
      padding: 15px 0;
      position: fixed;
      bottom: 0;
      width: 100%;
    }

    /* Sidebar Custom Styling */
    .sidebar {
      background: linear-gradient(90deg, #003366, #00b0f0); /* Matching the logo's color */
      color: white;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      width: 250px;
      padding: 20px;
      box-shadow: 2px 0 5px rgba(0,0,0,0.1);
    }

    .sidebar h4 {
      color: #00b0f0;
      text-align: center;
    }

    .sidebar .nav-link {
      color: #ffffff;
      font-size: 16px;
      font-weight: 400;
    }

    .sidebar .nav-link:hover {
      background-color: #00aaff;
      color: #003366;
    }

    .sidebar .nav-item.active .nav-link {
      background-color: #00b0f0;
      color: #003366;
    }
  </style>
</head>
<body>

<!-- Header -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom fixed-top shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="{% url 'home' %}">
      <img src="https://www.techvistacode.com/_next/static/media/techvistacode.b7338ba6.svg" alt="Logo">
      <span>TechVistaCode</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        {% if user.is_authenticated %}
          <li class="nav-item"><a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a></li>
        {% else %}
          <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">Login</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'register' %}">Register</a></li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>

<!-- Content -->
<div class="container mt-4">
  {% block content %}
  {% endblock %}
</div>

<!-- Footer -->
<footer>
  <div class="container">
    <small>&copy; 2025 TechVistaCode | Workshop Management System</small>
  </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
