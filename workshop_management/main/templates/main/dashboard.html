{% extends "main/base.html" %}

{% block content %}
<!-- Main Layout with Sidebar -->
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar (Fixed) -->
        <div class="col-md-2 bg-dark text-white p-4" style="height: 100vh; position: fixed; top: 0; left: 0; background-color: #003366;">
            <h4 class="text-center mb-4" style="color: #00b0f0;">Dashboard</h4>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link text-white" href="#" style="color: #ffffff;">
                        <i class="bi bi-house-door"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="{% url 'manage_workshops' %}">
                        <i class="bi bi-briefcase"></i> Manage Workshops
                    </a>                    
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="#" style="color: #ffffff;">
                        <i class="bi bi-person-check"></i> Participants
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="#" style="color: #ffffff;">
                        <i class="bi bi-bar-chart-line"></i> Reports
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="#" style="color: #ffffff;">
                        <i class="bi bi-gear"></i> Settings
                    </a>
                </li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 offset-md-2 p-4" style="margin-left: 16.66%; background-color: #f1f1f1; border-radius: 8px;">
            <h2 class="mb-4" style="color: #003366;">Welcome to your Dashboard</h2>
            <p style="color: #333333;">You are successfully logged in!</p>
        </div>
    </div>
</div>

<!-- Inline CSS for hover effects and active links -->
<style>
    .nav-link {
        color: #ffffff; /* Default color for links */
        font-weight: 500;
        transition: background-color 0.3s ease; /* Smooth transition for hover */
    }
    .nav-link:hover {
        background-color: #00b0f0; /* Light blue for hover effect */
        color: #003366; /* Dark blue for text when hovering */
    }
    .nav-item.active .nav-link {
        background-color: #00b0f0; /* Light blue for active link */
        color: #003366; /* Dark blue for text */
    }

    .container-fluid {
        padding-left: 0;
        padding-right: 0;
    }

    .navbar-custom {
        background: linear-gradient(90deg, #030f27, #005f99);
    }

    .navbar-custom .nav-link {
        color: white !important;
        font-weight: 500;
    }

    .navbar-custom .nav-link:hover {
        color: #00aaff !important;
    }

    footer {
        background: linear-gradient(90deg, #030f27, #005f99);
        color: white;
        text-align: center;
        padding: 15px 0;
        position: fixed;
        bottom: 0;
        width: 100%;
    }

    /* Enhanced button styles for sidebar */
    .nav-link i {
        margin-right: 10px; /* Space between icon and text */
    }

    /* Main content styling */
    .col-md-10 {
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Soft shadow effect */
        border-radius: 8px;
    }

    h2 {
        font-size: 28px;
        font-weight: bold;
        margin-bottom: 30px;
    }

    .nav-item {
        border-bottom: 1px solid #ddd; /* Subtle border between items */
    }

    .nav-item:last-child {
        border-bottom: none; /* Remove border from last item */
    }
</style>

{% endblock %}
