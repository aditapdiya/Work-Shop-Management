<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workshop Feedback Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

  <div class="min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-xl">
      <h2 class="text-3xl font-bold text-center text-blue-800 mb-6">Workshop Feedback Form</h2>

      <form action="#" method="POST" class="space-y-5">

        <!-- Full Name -->
        <div class="flex items-center border border-gray-300 rounded-lg px-3 py-2 bg-white">
          <svg class="w-5 h-5 text-gray-500 mr-3" fill="none" stroke="currentColor" stroke-width="2"
               viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M5.121 17.804A9 9 0 0112 15a9 9 0 016.879 2.804M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          <input type="text" name="name" placeholder="Full Name" required
                 class="w-full outline-none bg-transparent text-gray-700">
        </div>

        <!-- Email Address -->
        <div class="flex items-center border border-gray-300 rounded-lg px-3 py-2 bg-white">
          <svg class="w-5 h-5 text-gray-500 mr-3" fill="none" stroke="currentColor" stroke-width="2"
               viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M16 12H8m8 0l-8-8m8 8l-8 8" />
          </svg>
          <input type="email" name="email" placeholder="Email Address" required
                 class="w-full outline-none bg-transparent text-gray-700">
        </div>

        <!-- Rating -->
        <div>
          <label class="block font-medium text-gray-700 mb-2">How would you rate the workshop?</label>
          <div class="flex space-x-4">
            <label class="flex items-center space-x-1">
              <input type="radio" name="rating" value="1" required>
              <span>1</span>
            </label>
            <label class="flex items-center space-x-1">
              <input type="radio" name="rating" value="2">
              <span>2</span>
            </label>
            <label class="flex items-center space-x-1">
              <input type="radio" name="rating" value="3">
              <span>3</span>
            </label>
            <label class="flex items-center space-x-1">
              <input type="radio" name="rating" value="4">
              <span>4</span>
            </label>
            <label class="flex items-center space-x-1">
              <input type="radio" name="rating" value="5">
              <span>5</span>
            </label>
          </div>
        </div>

        <!-- Most Helpful Part -->
        <div>
          <textarea name="most_helpful_part" rows="3"
                    placeholder="What was the most helpful part?"
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 outline-none resize-none"
                    required></textarea>
        </div>

        <!-- Suggestions -->
        <div>
          <textarea name="suggestions" rows="3"
                    placeholder="Any suggestions for improvement?"
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 outline-none resize-none"
                    required></textarea>
        </div>

        <!-- Submit Button -->
        <div>
          <button type="submit"
                  class="w-full bg-blue-800 hover:bg-blue-900 text-white font-semibold py-3 rounded-full transition duration-200">
            Submit Feedback
          </button>
        </div>

      </form>
    </div>
  </div>

</body>
</html>
